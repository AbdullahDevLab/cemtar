<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سنتر بيرفكت التعليمي</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#1b2233;--mut:#6b7385;--pr:#4f46e5;--ok:#16a34a;--no:#dc2626;--wn:#d97706;--bd:#e2e6f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--card:#182033;--tx:#e8ecf6;--mut:#939bb0;--bd:#2a344c;--pr:#818cf8}}
:root[data-theme="dark"]{--bg:#0e1320;--card:#182033;--tx:#e8ecf6;--mut:#939bb0;--bd:#2a344c;--pr:#818cf8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.5}
header{background:var(--pr);color:#fff;padding:16px 14px;text-align:center;font-size:20px;font-weight:700}
nav{display:flex;gap:6px;padding:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;overflow-x:auto}
nav button{flex:1;min-width:80px;padding:10px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{max-width:820px;margin:0 auto;padding:0 12px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:16px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.btn{padding:11px 14px;border:0;border-radius:10px;background:var(--pr);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:var(--ok)}.btn.s{background:var(--bd);color:var(--tx)}.btn.r{background:var(--no)}.btn.sm{padding:6px 10px;font-size:13px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}.item small{color:var(--mut);display:block}
.bd{padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.bd.y{background:#16a34a22;color:var(--ok)}.bd.n{background:#dc262622;color:var(--no)}
.stats{display:flex;gap:8px;margin-bottom:10px}.stats div{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--bg);font-weight:700}
.stats span{display:block;font-size:12px;color:var(--mut);font-weight:400}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:12px;z-index:20}
.modal.on{display:flex}
.box{background:var(--card);border-radius:16px;padding:14px;width:100%;max-width:420px;max-height:92vh;overflow:auto;text-align:center}
#reader{width:100%;border-radius:12px;overflow:hidden;min-height:60px}
#banner{margin:10px 0;padding:14px;border-radius:12px;font-weight:700;font-size:17px;background:var(--bg);color:var(--mut)}
#banner.ok{background:#16a34a;color:#fff}#banner.bad{background:#dc2626;color:#fff}#banner.warn{background:#d97706;color:#fff}
#feed{text-align:right;font-size:14px;max-height:130px;overflow:auto}#feed div{padding:4px 0;border-bottom:1px solid var(--bd)}
#qrbox{display:flex;justify-content:center;margin:12px 0}
.empty{text-align:center;color:var(--mut);padding:16px}
@media print{body *{visibility:hidden}#qrModal .box,#qrModal .box *{visibility:visible}#qrModal .box{position:absolute;inset:0 auto auto 0;width:100%}.no-print{display:none!important}}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:center}
#cardsBox{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.cardp{border:1px dashed #888;border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;background:#fff;color:#000}
@media print{#cardsModal .box,#cardsModal .box *{visibility:visible}#cardsModal .box{position:absolute;inset:0 auto auto 0;width:100%;max-width:none}}
</style></head><body>
<header>🎓 سنتر بيرفكت التعليمي</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal" id="scanModal" style="z-index:40"><div class="box">
 <h3 id="scanTitle"></h3>
 <div id="reader"></div>
 <div id="banner">وجّه الكاميرا ناحية كود الطالب</div>
 <div id="feed"></div>
 <button class="btn r" style="margin-top:10px;width:100%" onclick="closeScan()">إنهاء</button>
</div></div>

<div class="modal" id="qrModal"><div class="box">
 <h3 id="qrName"></h3><div id="qrInfo" style="color:var(--mut)"></div>
 <div id="qrbox"></div>
 <div class="row no-print"><button class="btn g" onclick="$('qrModal').classList.remove('on');openSend([curQR])">📲 إرسال واتساب</button><button class="btn" onclick="window.print()">🖨️ طباعة</button><button class="btn s" onclick="$('qrModal').classList.remove('on')">إغلاق</button></div>
</div></div>

<div class="modal on" id="loginModal"><div class="box">
 <h3>🎓 سنتر بيرفكت التعليمي</h3><div style="color:var(--mut);margin-bottom:8px">🔐 تسجيل دخول الإدارة</div>
 <input id="lem" type="email" placeholder="البريد الإلكتروني" dir="ltr">
 <input id="lpw" type="password" placeholder="كلمة المرور" dir="ltr" onkeydown="if(event.key==='Enter')login()">
 <div id="lerr" style="color:var(--no);min-height:22px;font-size:14px"></div>
 <button class="btn" style="width:100%" onclick="login()">دخول</button>
 <button class="btn s" style="width:100%;margin-top:8px" onclick="$('pubModal').classList.add('on')">🔍 استعلام للطلاب وأولياء الأمور</button>
</div></div>

<div class="modal" id="pubModal" style="z-index:30"><div class="box">
 <h3>🎓 سنتر بيرفكت التعليمي</h3><div style="color:var(--mut);margin-bottom:8px">🔍 كارت الطالب والاستعلام</div>
 <input id="pubCode" placeholder="اكتب كود الطالب المطبوع على الكارت" dir="ltr" onkeydown="if(event.key==='Enter')pubLookup(this.value)">
 <div class="row"><button class="btn" onclick="pubLookup($('pubCode').value)">بحث</button><button class="btn g" onclick="openScan('pub','pub')">📷 مسح QR</button></div>
 <div id="pubQR" style="display:flex;justify-content:center;margin-top:10px"></div>
 <div id="pubRes" style="margin-top:10px;text-align:right"></div>
 <button class="btn s" style="width:100%;margin-top:10px" onclick="$('pubModal').classList.remove('on')">دخول الإدارة</button>
</div></div>
<div class="modal" id="sendModal"><div class="box">
 <h3>📨 إرسال كارت QR على واتساب</h3>
 <div id="sendInfo"></div>
 <div class="row" style="margin-top:10px"><button class="btn g" onclick="sendTo('s')">📲 للطالب</button><button class="btn g" onclick="sendTo('p')">📲 لولي الأمر</button></div>
 <div class="row" style="margin-top:8px"><button class="btn s" onclick="sendNext(-1)">◀ السابق</button><button class="btn" onclick="sendNext(1)">التالي ▶</button></div>
 <button class="btn s" style="width:100%;margin-top:8px" onclick="$('sendModal').classList.remove('on')">إغلاق</button>
</div></div>
<div class="modal" id="cardsModal"><div class="box" style="max-width:800px">
 <div class="row no-print"><button class="btn" onclick="window.print()">🖨️ طباعة</button><button class="btn s" onclick="$('cardsModal').classList.remove('on')">إغلاق</button></div>
 <div id="cardsBox"></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const firebaseConfig={
  apiKey:"AIzaSyCfH-5PenUQ5KM_waHaQfeTbEa6hd5NV1E",
  authDomain:"abdo-f496d.firebaseapp.com",
  projectId:"abdo-f496d",
  storageBucket:"abdo-f496d.firebasestorage.app",
  messagingSenderId:"656645256230",
  appId:"1:656645256230:web:dfab44d62b8dcc76f562e7"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),fs=firebase.firestore(),FV=firebase.firestore.FieldValue;
fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
let db={students:[],att:{},rec:{},hw:{}},unsubs=[];
const errh=e=>{console.error(e);alert('خطأ في قاعدة البيانات: '+(e.code||e.message))};
function startSync(){
 const cut=new Date(Date.now()-150*864e5).toLocaleDateString('en-CA');
 unsubs.push(fs.collection('students').orderBy('createdAt').onSnapshot(sn=>{db.students=sn.docs.map(d=>d.data());refresh()},errh));
 unsubs.push(fs.collection('records').where('date','>=',cut).onSnapshot(sn=>{
  const n={att:{},rec:{},hw:{}};
  sn.docs.forEach(d=>{const x=d.data();if(n[x.k])n[x.k][x.date]=x.ids||[]});
  Object.assign(db,n);refresh()},errh));
}
let rt;function refresh(){clearTimeout(rt);rt=setTimeout(doRefresh,250)}
function doRefresh(){
 if(!auth.currentUser||scanner)return;
 if(tab==='students'){if($('slist'))renderStudentsList()}
 else if(tab==='ask'){renderAskRes()}
 else if(document.activeElement&&document.activeElement.tagName==='INPUT'){if($('seclist'))renderSecList(tab)}
 else renderSec(tab);
}
auth.onAuthStateChanged(u=>{
 unsubs.forEach(f=>f());unsubs=[];
 if(u){$('loginModal').classList.remove('on');startSync();render()}
 else{db={students:[],att:{},rec:{},hw:{}};$('main').innerHTML='';$('loginModal').classList.add('on')}
});
async function login(){
 $('lerr').textContent='';
 try{await auth.signInWithEmailAndPassword($('lem').value.trim(),$('lpw').value)}
 catch(e){$('lerr').textContent='بيانات الدخول غير صحيحة ('+(e.code||'')+')'}
}
function logout(){auth.signOut()}
function mark(k,d,id,on){
 const b=fs.batch();
 b.set(fs.collection('records').doc(k+'_'+d),{k,date:d,ids:on?FV.arrayUnion(id):FV.arrayRemove(id)},{merge:true});
 b.set(fs.collection('public').doc(id),{[k]:on?FV.arrayUnion(d):FV.arrayRemove(d)},{merge:true});
 return b.commit().catch(errh);
}
let curQR='',sendList=[],sendIdx=0;
function guard(k,d,id,on){
 const h=x=>(db[x][d]||[]).includes(id);
 if(k!=='att'&&on&&!h('att'))return 'لا يمكن التسجيل: الطالب غير مسجّل حضور في هذا اليوم';
 if(k==='att'&&!on&&(h('rec')||h('hw')))return 'لا يمكن إلغاء الحضور: الطالب لديه تسميع أو واجب مسجّل';
 return '';
}
const waNum=n=>{let p=(n||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p='20'+p.slice(1);return p};
function startQueue(){
 const g=prompt('اسم المجموعة (اتركه فاضي لكل الطلاب)','');if(g===null)return;
 const ids=db.students.filter(x=>!x.qrSent&&(!g||x.group===g.trim())).map(x=>x.id);
 if(!ids.length)return alert('تم الإرسال لكل الطلاب');
 openSend(ids);
}
function openSend(ids){sendList=ids;sendIdx=0;$('sendModal').classList.add('on');renderSend()}
function sendNext(n){sendIdx=Math.min(Math.max(sendIdx+n,0),sendList.length-1);renderSend()}
function renderSend(){
 const st=db.students.find(x=>x.id===sendList[sendIdx]);
 if(!st){$('sendModal').classList.remove('on');return}
 $('sendInfo').innerHTML=`<div style="color:var(--mut)">${sendIdx+1} / ${sendList.length}</div><h3>${esc(st.name)}</h3><div style="color:var(--mut);font-size:13px">الطالب: ${esc(st.phone||'—')}<br>ولي الأمر: ${esc(st.parent||'—')}</div>${st.qrSent?'<div style="color:var(--ok);margin-top:6px">✔ تم الإرسال من قبل</div>':''}`;
}
function sendTo(w){
 const st=db.students.find(x=>x.id===sendList[sendIdx]);if(!st)return;
 const num=waNum(w==='s'?st.phone:st.parent);
 if(!num)return alert(w==='s'?'لا يوجد رقم للطالب':'لا يوجد رقم لولي الأمر');
 const link=location.href.split('#')[0]+'#card='+st.id;
 const t='سنتر بيرفكت التعليمي 🎓\nكارت الطالب: '+st.name+'\nالكود: '+st.id+'\n\nافتح الرابط لعرض الـQR الخاص بالطالب واحتفظ به لتسجيل الحضور، ومن نفس الرابط تتابع الحضور والتسميع والواجب:\n'+link;
 window.open('https://wa.me/'+num+'?text='+encodeURIComponent(t),'_blank');
 fs.collection('students').doc(st.id).update({qrSent:true}).then(renderSend).catch(()=>{});
}
let askUnsub=null,askData=null;
function pickAsk(id){
 askId=id;askData=null;if(askUnsub)askUnsub();
 askUnsub=fs.collection('public').doc(id).onSnapshot(d=>{askData=d.exists?d.data():null;renderAskRes()},()=>{});
 renderAskRes();
}
const newId=()=>'S'+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>(b%36).toString(36)).join('').toUpperCase();
const recFor=id=>{const o={};['att','rec','hw'].forEach(k=>o[k]=Object.keys(db[k]).filter(d=>db[k][d].includes(id)));return o};
function profileHTML(name,r,d){
 const K=['att','rec','hw'],has=(k,x)=>(r[k]||[]).includes(x);
 const rows=K.map(k=>{const y=has(k,d);return `<div class="item"><b>${SEC[k].icon} ${SEC[k].t}</b><span class="bd ${y?'y':'n'}">${y?'✔ '+SEC[k].y:'✖ '+SEC[k].n}</span></div>`}).join('');
 const days=[...new Set(K.flatMap(k=>r[k]||[]))].sort().reverse().slice(0,15);
 return `<h3>${esc(name)}</h3><div style="color:var(--mut);margin-bottom:6px">حالة يوم ${d}</div>${rows}
 <div class="stats" style="margin-top:10px">${K.map(k=>`<div>${(r[k]||[]).length}<span>إجمالي ${SEC[k].t}</span></div>`).join('')}</div>
 <table><tr><th>التاريخ</th>${K.map(k=>`<th>${SEC[k].t}</th>`).join('')}</tr>${days.map(x=>`<tr><td>${x}</td>${K.map(k=>`<td>${has(k,x)?'✔':'—'}</td>`).join('')}</tr>`).join('')}</table>`;
}
function renderAsk(){
 $('main').innerHTML=`<div class="card"><h3>🔍 استعلام شامل (حضور • تسميع • واجب)</h3>
  <input type="date" value="${dates.ask}" onchange="dates.ask=this.value;renderAskRes()">
  <button class="btn g" style="width:100%;margin-bottom:8px" onclick="openScan('ask','ask')">📷 استعلام بالـQR</button>
  <input placeholder="🔍 ابحث بالاسم أو المجموعة" value="${esc(q)}" oninput="q=this.value;renderAskList()"><div id="asklist"></div></div>
  <div class="card" id="askres"></div>`;
 renderAskList();renderAskRes();
}
function renderAskList(){
 const l=q?db.students.filter(s=>s.name.includes(q)||(s.group||'').includes(q)).slice(0,8):[];
 $('asklist').innerHTML=l.map(s=>`<div class="item" style="cursor:pointer" onclick="pickAsk('${s.id}')"><b>${esc(s.name)}</b><small>${esc(s.group||'')}</small></div>`).join('');
}
function renderAskRes(){
 const el=$('askres');if(!el)return;
 const s=db.students.find(x=>x.id===askId);
 el.style.display=s?'':'none';if(!s)return;
 el.innerHTML=profileHTML(s.name,askData||recFor(s.id),dates.ask)+`<button class="btn g" style="width:100%;margin-top:10px" onclick="wa('${s.id}')">📲 إرسال التقرير لولي الأمر (واتساب)</button>`;
}
function wa(id){
 const s=db.students.find(x=>x.id===id),r=recFor(id),d=dates.ask;
 let p=(s.parent||s.phone||'').replace(/\D/g,'');if(!p)return alert('لا يوجد رقم لولي الأمر');
 if(p.startsWith('0'))p='20'+p.slice(1);
 const t=`سنتر بيرفكت التعليمي 🎓\nتقرير الطالب ${s.name} يوم ${d}:\n`+['att','rec','hw'].map(k=>`${SEC[k].icon} ${SEC[k].t}: ${r[k].includes(d)?SEC[k].y+' ✔':SEC[k].n+' ✖'}`).join('\n');
 window.open('https://wa.me/'+p+'?text='+encodeURIComponent(t),'_blank');
}
function editStudent(id){
 const s=db.students.find(x=>x.id===id);
 const name=prompt('اسم الطالب',s.name);if(!name||!name.trim())return;
 const g=prompt('اسم المجموعة',s.group||''),pr=prompt('رقم ولي الأمر',s.parent||'');
 const b=fs.batch();
 b.update(fs.collection('students').doc(id),{name:name.trim(),group:(g??s.group??'').trim(),parent:(pr??s.parent??'').trim()});
 b.set(fs.collection('public').doc(id),{name:name.trim()},{merge:true});
 b.commit().catch(errh);
}
function printCards(){
 const g=prompt('اكتب اسم المجموعة لطباعة كروتها (اتركها فاضية لطباعة الكل)','');if(g===null)return;
 const L=db.students.filter(s=>!g||s.group===g.trim());
 const m=$('cardsBox');m.innerHTML='';
 L.forEach(s=>{const c=document.createElement('div');c.className='cardp';c.innerHTML=`<b>${esc(s.name)}</b><small>الصف الثاني (بكالوريا)</small><small>${esc(s.group||'')}</small><div></div><small>${s.id}</small>`;m.appendChild(c);new QRCode(c.children[2],{text:s.id,width:110,height:110})});
 $('cardsModal').classList.add('on');
}
async function syncPublic(){
 const list=db.students;
 try{
  for(let i=0;i<list.length;i+=200){
   const b=fs.batch();
   list.slice(i,i+200).forEach(st=>{
    const o={name:st.name};
    ['att','rec','hw'].forEach(k=>{const ds=Object.keys(db[k]).filter(d=>db[k][d].includes(st.id));if(ds.length)o[k]=FV.arrayUnion(...ds)});
    b.set(fs.collection('public').doc(st.id),o,{merge:true});
   });
   await b.commit();
  }
  alert('تمت المزامنة ('+list.length+' طالب)');
 }catch(e){errh(e)}
}
async function pubLookup(code){
 code=(code||'').replace(/[^A-Za-z0-9]/g,'');if(!code)return;
 $('pubQR').innerHTML='';$('pubRes').textContent='جاري البحث...';
 try{const r=await fs.collection('public').doc(code).get();
  $('pubRes').innerHTML=r.exists?profileHTML(r.data().name||'طالب',r.data(),today()):'<div class="empty">❌ كود غير صحيح</div>';
  if(r.exists)new QRCode($('pubQR'),{text:code,width:200,height:200});
 }catch(e){$('pubRes').innerHTML='<div class="empty">تعذر الاتصال، حاول مرة أخرى</div>'}
}
const SEC={
 att:{t:'الحضور',icon:'✅',y:'حاضر',n:'غائب',verb:'تسجيل الحضور'},
 rec:{t:'التسميع',icon:'📖',y:'سمّع',n:'لم يسمّع',verb:'تسجيل التسميع'},
 hw:{t:'الواجب',icon:'📝',y:'حلّ الواجب',n:'لم يحل',verb:'تسجيل حل الواجب'}
};
let tab='students',dates={att:today(),rec:today(),hw:today(),ask:today(),pub:today()},q='',askId=null,grp='';

function renderNav(){
 const tabs=[['students','👥 الطلاب'],['att','✅ الحضور'],['rec','📖 التسميع'],['hw','📝 الواجب'],['ask','🔍 استعلام']];
 $('nav').innerHTML=tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
}
function go(k){tab=k;q='';render()}
function render(){if(!auth.currentUser)return;renderNav();tab==='students'?renderStudents():tab==='ask'?renderAsk():renderSec(tab)}

function renderStudents(){
 const list=db.students.filter(s=>(s.name+s.phone+s.group).includes(q));
 $('main').innerHTML=`
 <div class="card"><h3>➕ إضافة طالب جديد</h3>
  <input id="fn" placeholder="اسم الطالب *">
  <div class="row"><input id="fp" placeholder="رقم الطالب" inputmode="tel"><input id="fg" placeholder="رقم ولي الأمر" inputmode="tel"></div>
  <div class="row"><input id="fgr" value="الصف الثاني (بكالوريا)" readonly style="opacity:.85"><input id="fc" placeholder="اسم المجموعة"></div>
  <input id="fd" placeholder="ملاحظات">
  <button class="btn g" style="width:100%" onclick="addStudent()">حفظ وإنشاء QR</button></div>
 <div class="card"><h3>قائمة الطلاب (<span id="scount">${db.students.length}</span>)</h3>
  <input placeholder="🔍 بحث بالاسم أو الرقم أو المجموعة" value="${esc(q)}" oninput="q=this.value;renderStudentsList()" id="sq">
  <div id="slist"></div><button class="btn g" style="width:100%;margin-top:8px" onclick="startQueue()">📨 إرسال QR واتساب لمن لم يُرسل له (واحد ورا واحد)</button>
  <button class="btn s" style="width:100%;margin-top:8px" onclick="printCards()">🖨️ طباعة كروت QR</button></div>
 <div class="card"><h3>☁️ الحساب</h3><p style="color:var(--mut);margin:0 0 8px;font-size:14px">البيانات متزامنة مع Firebase وتظهر على كل أجهزة الإدارة.</p><p style="font-size:13px;margin:0 0 4px">رابط الاستعلام للطلاب وأولياء الأمور:</p><p style="font-size:13px;word-break:break-all;direction:ltr;text-align:left;margin:0 0 8px">${location.href.split('#')[0]}#inquiry</p>
  <div class="row"><button class="btn s" onclick="syncPublic()">🔄 مزامنة بيانات الاستعلام</button><button class="btn s" onclick="logout()">تسجيل خروج</button></div></div>`;
 renderStudentsList();
}
function renderStudentsList(){
 const sc=$('scount');if(sc)sc.textContent=db.students.length;
 const all=db.students.filter(s=>(s.name+(s.phone||'')+(s.group||'')).includes(q)),list=all.slice(0,150);
 $('slist').innerHTML=list.length?list.map(s=>`<div class="item"><div><b>${esc(s.name)}</b><small>${esc(s.group||'')} ${s.phone?'• '+esc(s.phone):''}</small></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn sm g" onclick="openSend(['${s.id}'])">📲 ${s.qrSent?'✔ ':''}إرسال</button><button class="btn sm" onclick="showQR('${s.id}')">QR</button><button class="btn sm s" onclick="editStudent('${s.id}')">تعديل</button><button class="btn sm r" onclick="delStudent('${s.id}')">حذف</button></div></div>`).join(''):'<div class="empty">لا يوجد طلاب</div>';
 if(all.length>150)$('slist').insertAdjacentHTML('beforeend','<div class="empty">معروض 150 من '+all.length+' — استخدم البحث</div>');
}
function addStudent(){
 const name=$('fn').value.trim();if(!name){alert('اكتب اسم الطالب');return}
 const id='S'+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>(b%36).toString(36)).join('').toUpperCase();
 const s={id,name,phone:$('fp').value.trim(),parent:$('fg').value.trim(),grade:'الصف الثاني (بكالوريا)',group:$('fc').value.trim(),note:$('fd').value.trim()};
 s.createdAt=Date.now();
 (()=>{const b=fs.batch();b.set(fs.collection('students').doc(id),s);b.set(fs.collection('public').doc(id),{name,att:[],rec:[],hw:[]});return b.commit()})().then(()=>{['fn','fp','fg','fc','fd'].forEach(i=>$(i).value='');showQR(id)}).catch(errh);
}
function delStudent(id){
 if(!confirm('حذف الطالب وكل سجلاته؟'))return;
 const b=fs.batch();b.delete(fs.collection('students').doc(id));b.delete(fs.collection('public').doc(id));
 ['att','rec','hw'].forEach(k=>{for(const d in db[k])if(db[k][d].includes(id))b.update(fs.collection('records').doc(k+'_'+d),{ids:FV.arrayRemove(id)})});
 b.commit().catch(errh);
}
function showQR(id){
 const s=db.students.find(x=>x.id===id);if(!s)return;
 $('qrName').textContent=s.name;curQR=id;$('qrInfo').textContent='الصف الثاني (بكالوريا)'+(s.group?' • '+s.group:'')+' • '+s.id;
 $('qrbox').innerHTML='';
 new QRCode($('qrbox'),{text:s.id,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
 $('qrModal').classList.add('on');
}

function renderSec(k){
 const c=SEC[k],d=dates[k],ids=db[k][d]||[];
 const list=db.students.filter(s=>s.name.includes(q)||(s.group||'').includes(q));
 const yes=db.students.filter(s=>ids.includes(s.id)).length;
 $('main').innerHTML=`
 <div class="card"><h3>${c.icon} ${c.t}</h3>
  <input type="date" value="${d}" onchange="dates['${k}']=this.value;renderSec('${k}')">
  <div class="row"><button class="btn g" onclick="openScan('${k}','rec')">📷 ابدأ ${c.verb}</button>
  <button class="btn" onclick="openScan('${k}','ask')">🔍 استعلام بالـQR</button></div></div>
 <div class="card"><div class="stats"><div>${db.students.length}<span>إجمالي الطلاب</span></div><div style="color:var(--ok)">${yes}<span>${c.y}</span></div><div style="color:var(--no)">${db.students.length-yes}<span>${c.n}</span></div></div>
  <select onchange="grp=this.value;renderSecList('${k}')"><option value="">كل المجموعات</option>${[...new Set(db.students.map(x=>x.group).filter(Boolean))].map(g=>`<option ${g===grp?'selected':''}>${esc(g)}</option>`).join('')}</select>
  <input placeholder="🔍 بحث بالاسم" value="${esc(q)}" oninput="q=this.value;renderSecList('${k}')">
  <div id="seclist"></div>
  <p style="color:var(--mut);font-size:12px;margin:8px 0 0">اضغط على الحالة لتغييرها يدويًا.</p></div>`;
 renderSecList(k);
}
function renderSecList(k){
 const c=SEC[k],d=dates[k],ids=db[k][d]||[];
 const all=db.students.filter(s=>(!grp||s.group===grp)&&(s.name.includes(q)||(s.group||'').includes(q))),list=all.slice(0,200);
 $('seclist').innerHTML=list.length?list.map(s=>{const y=ids.includes(s.id);
  return `<div class="item"><div><b>${esc(s.name)}</b><small>${esc(s.group||'')}</small></div><span class="bd ${y?'y':'n'}" onclick="toggle('${k}','${s.id}')">${y?'✔ '+c.y:'✖ '+c.n}</span></div>`}).join(''):'<div class="empty">لا يوجد طلاب</div>';
 if(all.length>200)$('seclist').insertAdjacentHTML('beforeend','<div class="empty">معروض 200 من '+all.length+' — اختر مجموعة أو ابحث</div>');
}
function toggle(k,id){
 const d=dates[k],on=!(db[k][d]||[]).includes(id),m=guard(k,d,id,on);
 if(m)return alert(m);mark(k,d,id,on);
}

let scanner=null,ctx=null,last='',lastT=0,ac;
function beep(ok){
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
 o.frequency.value=ok?880:220;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.15)}catch(e){}
 if(navigator.vibrate)navigator.vibrate(ok?60:[80,50,80]);
}
function say(cls,txt){
 const b=$('banner');b.className=cls;b.textContent=txt;
 const f=document.createElement('div');f.textContent=new Date().toLocaleTimeString('ar-EG')+' — '+txt;$('feed').prepend(f);
}
async function openScan(k,mode){
 ctx={k,mode,d:dates[k]};last='';
 $('scanTitle').textContent=(k==='ask'||k==='pub'?'استعلام شامل':mode==='rec'?SEC[k].verb:'استعلام عن '+SEC[k].t)+' — '+ctx.d;
 $('feed').innerHTML='';$('banner').className='';$('banner').textContent='وجّه الكاميرا ناحية كود الطالب';
 $('scanModal').classList.add('on');
 try{
  scanner=new Html5Qrcode('reader');
  await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},onScan,()=>{});
 }catch(e){say('bad','تعذر تشغيل الكاميرا. اسمح للموقع باستخدام الكاميرا.')}
}
function closeScan(){
 const s=scanner;scanner=null;
 if(s)s.stop().then(()=>s.clear()).catch(()=>{});
 $('scanModal').classList.remove('on');render();
}
function onScan(txt){
 const now=Date.now();
 if(txt===last&&now-lastT<3000)return;
 last=txt;lastT=now;
 if(ctx.k==='pub'){closeScan();$('pubCode').value=txt.trim();pubLookup(txt);return}
 const s=db.students.find(x=>x.id===txt.trim());
 if(!s){say('bad','❌ كود غير معروف');beep(false);return}
 const {k,mode,d}=ctx;
 if(k==='ask'){pickAsk(s.id);const r=recFor(s.id);say('ok',s.name+' — '+['att','rec','hw'].map(x=>SEC[x].t+(r[x].includes(d)?' ✔':' ✖')).join(' | '));beep(true);return}
 const c=SEC[k],has=(db[k][d]||[]).includes(s.id);
 if(mode==='rec'){
  if(has){say('warn','⚠️ '+s.name+' — مسجّل بالفعل');beep(false)}
  else if(guard(k,d,s.id,true)){say('bad','⛔ '+s.name+' — غير مسجّل حضور اليوم');beep(false)}else{mark(k,d,s.id,true);say('ok','✅ تم بنجاح — '+s.name);beep(true)}
 }else{
  const total=Object.values(db[k]).filter(x=>x.includes(s.id)).length;
  say(has?'ok':'bad',(has?'✔ ':'✖ ')+s.name+': '+(has?c.y:c.n)+' يوم '+d+' (إجمالي '+total+' مرة)');beep(has);
 }
}
renderNav();
const hm=location.hash.match(/^#card=([A-Za-z0-9]+)/);
if(hm){$('pubModal').classList.add('on');$('pubCode').value=hm[1];pubLookup(hm[1])}
else if(location.hash==='#inquiry')$('pubModal').classList.add('on');
</script>
</body></html>
